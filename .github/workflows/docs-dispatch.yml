name: Dispatch de documentación

on:
  push:
    branches: ["develop", "main"]

jobs:
  notify-docs:
    name: Disparar actualización de documentación
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository_dispatch a ERP.Core.Docs.Api
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          script: |
            const branch = (context.ref || '').replace('refs/heads/', '');
            await github.rest.repos.createDispatchEvent({
              owner: 'alpac-organization',
              repo: 'ERP.Core.Docs.Api',
              event_type: 'api-updated',
              client_payload: {
                ref: branch,
                repo: context.payload.repository?.full_name ?? context.ref,
              },
            });
